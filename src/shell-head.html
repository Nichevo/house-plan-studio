<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1D6A50">
<meta name="description" content="Build a floor plan of your house from photos and a few measurements, with a 3D view and exports.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<script>
/* Standalone app: replaces the claude.ai capabilities with local equivalents. */
(function () {
  var KEY = "house-api-key";
  window.HOUSE_KEY = {
    get: function () { try { return localStorage.getItem(KEY) || ""; } catch (e) { return ""; } },
    set: function (v) { try { if (v) localStorage.setItem(KEY, v); else localStorage.removeItem(KEY); } catch (e) { } }
  };
  function b64(blob) { return new Promise(function (res, rej) { var r = new FileReader(); r.onload = function () { res(String(r.result).split(",")[1]); }; r.onerror = rej; r.readAsDataURL(blob); }); }
  function save(req) {
    var blob = req.data instanceof Blob ? req.data : new Blob([req.data]);
    var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = req.filename;
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 5000);
    return Promise.resolve({ status: "saved" });
  }
  async function ask(prompt, opts) {
    var key = HOUSE_KEY.get(); if (!key) throw { code: "not_granted", message: "Add your API key in Settings." };
    var content = [];
    for (var b of (opts && opts.images) || []) content.push({ type: "image", source: { type: "base64", media_type: "image/jpeg", data: await b64(b) } });
    content.push({ type: "text", text: prompt });
    var r;
    try {
      r = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "content-type": "application/json", "x-api-key": key, "anthropic-version": "2026-10-21", "anthropic-beta": "server-side-fallback-2026-07-01", "anthropic-dangerous-direct-browser-access": "true" },
        body: JSON.stringify({ model: "claude-opus-5-5", max_tokens: 16000, output_config: { effort: "medium" }, fallbacks: "default", messages: [{ role: "user", content: content }] })
      });
    } catch (e) { throw { code: "network", message: "Couldn't reach Anthropic. Check your connection." }; }
    if (r.status === 401 || r.status === 403) throw { code: "bad_key", message: "Your API key was refused. Check it in Settings." };
    if (r.status === 429 || r.status === 529) throw { code: "rate_limited", message: "Claude is busy. Try again in a minute." };
    if (!r.ok) { var t = ""; try { t = (await r.json()).error.message; } catch (e) { } throw { code: "api_error", message: "Claude returned an error" + (t ? ": " + t : ".") }; }
    var m = await r.json();
    if (m.stop_reason === "refusal") throw { code: "refused", message: "Claude declined to look at these photos." };
    return (m.content || []).filter(function (c) { return c.type === "text"; }).map(function (c) { return c.text; }).join("");
  }
  window.HOUSE_CAPS = function (name) {
    if (name === "downloads") return { save: save };
    if (name === "sample") {
      if (!HOUSE_KEY.get()) return null;
      var f = async function (p, o) { return { text: await ask(p, o), truncated: false }; };
      f.limits = async function () { return { maxPromptBytes: 262144, images: { maxCount: 12, maxInputBytes: 30000000, mediaTypes: ["image/jpeg", "image/png", "image/webp"] } }; };
      f.json = async function (p, o) {
        var t = await ask(p, o), i = t.indexOf("{"), j = t.lastIndexOf("}");
        try { return JSON.parse(t.slice(i, j + 1)); } catch (e) { throw { code: "invalid_json", text: t }; }
      };
      return f;
    }
    return null;
  };
  var deferred = null;
  addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault(); deferred = e;
    var bar = document.querySelector(".top"); if (!bar || document.getElementById("installBtn")) return;
    var b = document.createElement("button"); b.className = "btn primary"; b.id = "installBtn"; b.textContent = "Install app";
    b.onclick = function () { deferred.prompt(); deferred.userChoice.finally(function () { b.remove(); deferred = null; }); };
    bar.insertBefore(b, document.getElementById("sync"));
  });
  if ("serviceWorker" in navigator) addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () { }); });
})();
</script>
</head>
<body>
